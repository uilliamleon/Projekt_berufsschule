<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="pAiBody" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#bda1ff"></stop>
      <stop offset="35%" stop-color="#7c5cff"></stop>
      <stop offset="75%" stop-color="#5a3bd6"></stop>
      <stop offset="100%" stop-color="#1f0f5c"></stop>
    </radialGradient>
    <radialGradient id="pAiCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9b7bff" stop-opacity="0"></stop>
      <stop offset="70%" stop-color="#9b7bff" stop-opacity="0.4"></stop>
      <stop offset="100%" stop-color="#9b7bff" stop-opacity="0"></stop>
    </radialGradient>
    <linearGradient id="pAiGrid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5ef3ff" stop-opacity="0"></stop>
      <stop offset="100%" stop-color="#5ef3ff" stop-opacity="0.5"></stop>
    </linearGradient>
    <filter id="pAiGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="b"></feGaussianBlur>
      <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
    <clipPath id="pAiClip">
      <circle cx="50" cy="50" r="38"></circle>
    </clipPath>
  </defs>

  
  <circle cx="50" cy="50" r="46" fill="#7c5cff" opacity="0.2"></circle>
  <circle cx="50" cy="50" r="42" fill="#7c5cff" opacity="0.24"></circle>

  
  <circle cx="50" cy="50" r="40" fill="none" stroke="#a98bff" stroke-width="1.2" opacity="0.9" filter="url(#pAiGlow)"></circle>

  
  <circle cx="50" cy="50" r="38" fill="url(#pAiBody)"></circle>

  
  <g clip-path="url(#pAiClip)" opacity="0.7">
    <rect x="12" y="50" width="76" height="38" fill="url(#pAiGrid)"></rect>
    <g stroke="#5ef3ff" stroke-width="0.5" fill="none" opacity="0.8">
      <line x1="12" y1="58" x2="88" y2="58"></line>
      <line x1="12" y1="66" x2="88" y2="66"></line>
      <line x1="12" y1="74" x2="88" y2="74"></line>
      <line x1="12" y1="82" x2="88" y2="82"></line>
    </g>
    <g stroke="#5ef3ff" stroke-width="0.5" fill="none" opacity="0.6">
      <line x1="50" y1="50" x2="20" y2="88"></line>
      <line x1="50" y1="50" x2="32" y2="88"></line>
      <line x1="50" y1="50" x2="42" y2="88"></line>
      <line x1="50" y1="50" x2="50" y2="88"></line>
      <line x1="50" y1="50" x2="58" y2="88"></line>
      <line x1="50" y1="50" x2="68" y2="88"></line>
      <line x1="50" y1="50" x2="80" y2="88"></line>
    </g>
  </g>

  
  <g clip-path="url(#pAiClip)" opacity="0.85">
    <g fill="none" stroke="#5ef3ff" stroke-width="0.7" opacity="0.55">
      <circle cx="50" cy="42" r="9"></circle>
