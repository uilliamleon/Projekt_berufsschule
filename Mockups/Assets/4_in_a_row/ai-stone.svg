      <circle cx="50" cy="51" r="1.2"></circle>
      <circle cx="41" cy="42" r="1.2"></circle>
    </g>
  </g>

  
  <circle cx="50" cy="50" r="30" fill="url(#pAiCore)"></circle>

  
  <circle cx="50" cy="50" r="28" fill="none" stroke="#d8c9ff" stroke-width="0.6" opacity="0.4"></circle>

  
  <ellipse cx="40" cy="34" rx="14" ry="8" fill="#ffffff" opacity="0.4"></ellipse>
  <ellipse cx="38" cy="32" rx="6" ry="3" fill="#ffffff" opacity="0.65"></ellipse>
