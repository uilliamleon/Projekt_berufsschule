<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="pPlayerBody" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ff8fb8"></stop>
      <stop offset="35%" stop-color="#ff4d8a"></stop>
      <stop offset="75%" stop-color="#d6266a"></stop>
      <stop offset="100%" stop-color="#7a0f3a"></stop>
    </radialGradient>
    <radialGradient id="pPlayerCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff5c95" stop-opacity="0"></stop>
      <stop offset="70%" stop-color="#ff5c95" stop-opacity="0.35"></stop>
      <stop offset="100%" stop-color="#ff5c95" stop-opacity="0"></stop>
    </radialGradient>
    <linearGradient id="pPlayerGrid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd1e3" stop-opacity="0"></stop>
      <stop offset="100%" stop-color="#ffd1e3" stop-opacity="0.55"></stop>
    </linearGradient>
    <filter id="pPlayerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="b"></feGaussianBlur>
      <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
    <clipPath id="pPlayerClip">
      <circle cx="50" cy="50" r="38"></circle>
    </clipPath>
  </defs>

  
  <circle cx="50" cy="50" r="46" fill="#ff3d83" opacity="0.18"></circle>
  <circle cx="50" cy="50" r="42" fill="#ff3d83" opacity="0.22"></circle>

  
  <circle cx="50" cy="50" r="40" fill="none" stroke="#ff2d7a" stroke-width="1.2" opacity="0.9" filter="url(#pPlayerGlow)"></circle>

  
  <circle cx="50" cy="50" r="38" fill="url(#pPlayerBody)"></circle>

  
  <g clip-path="url(#pPlayerClip)" opacity="0.55">
    <rect x="12" y="50" width="76" height="38" fill="url(#pPlayerGrid)"></rect>
    <g stroke="#ffd1e3" stroke-width="0.5" fill="none" opacity="0.7">
      <line x1="12" y1="58" x2="88" y2="58"></line>
      <line x1="12" y1="66" x2="88" y2="66"></line>
      <line x1="12" y1="74" x2="88" y2="74"></line>
      <line x1="12" y1="82" x2="88" y2="82"></line>
    </g>
    <g stroke="#ffd1e3" stroke-width="0.5" fill="none" opacity="0.55">
      <line x1="50" y1="50" x2="20" y2="88"></line>
      <line x1="50" y1="50" x2="32" y2="88"></line>
      <line x1="50" y1="50" x2="42" y2="88"></line>
      <line x1="50" y1="50" x2="50" y2="88"></line>
      <line x1="50" y1="50" x2="58" y2="88"></line>
      <line x1="50" y1="50" x2="68" y2="88"></line>
      <line x1="50" y1="50" x2="80" y2="88"></line>
    </g>
  </g>

  
  <circle cx="50" cy="50" r="30" fill="url(#pPlayerCore)"></circle>

  
  <circle cx="50" cy="50" r="28" fill="none" stroke="#ffe3ee" stroke-width="0.6" opacity="0.4"></circle>

  
  <ellipse cx="40" cy="34" rx="14" ry="8" fill="#ffffff" opacity="0.45"></ellipse>
  <ellipse cx="38" cy="32" rx="6" ry="3" fill="#ffffff" opacity="0.7"></ellipse>
</svg>